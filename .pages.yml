# Pages CMS(app.pagescms.org) 편집 화면 설정.
# 원장님·담당자가 웹 화면에서 궁금해요 Q&A를 추가·수정하면 src/data/qna.json이 바뀌고, 사이트가 자동으로 다시 올라간다.
# 접근 권한: Pages CMS의 Collaborators에 이메일로 초대한 사람만 들어올 수 있다(GitHub 계정이 없어도 됨).
media: false

content:
  - name: qna
    label: 궁금해요 Q&A
    type: file
    path: src/data/qna.json
    format: json
    fields:
      - name: updated
        label: 최종 검수일
        description: 질문을 추가·수정하면 오늘 날짜로 바꿔 주세요.
        type: date
        options:
          format: yyyy-MM-dd
      - name: author
        label: 작성·검수
        type: string
      - name: groups
        label: 진료 분류
        description: 분류 5개(실버·임플란트·자연치아·사랑니·어린이)는 그대로 두고, 각 분류 안의 '질문과 답'만 추가·수정해 주세요.
        type: object
        list:
          min: 5
          max: 5
        fields:
          - name: id
            label: 분류 코드 (바꾸지 마세요)
            type: string
            required: true
          - name: tab
            label: 분류 이름
            type: string
            required: true
          - name: title
            label: 분류 제목
            type: string
            required: true
          - name: items
            label: 질문과 답
            type: object
            list: true
            fields:
              - name: q
                label: 질문
                description: 환자분이 실제로 묻는 말투로. 지역 이름(파주·운정·야당동)은 질문에 넣지 마세요.
                type: text
                required: true
              - name: a
                label: 답
                description: 결론부터 짧게. 지역 이름은 답 안에 한 번만(예: '운정 김앤김치과에서는…'). '최고·유일·100%·무통·완치 보장' 같은 표현, 치료 후기·전후 사진은 의료법상 쓸 수 없어요.
                type: text
                required: true
              - name: id
                label: 주소용 이름 (비워 두면 자동)
                description: 비워 두세요. 이미 있는 값은 다른 페이지가 연결해 쓰므로 바꾸지 마세요.
                type: string
